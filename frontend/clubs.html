      (function() {
        try {
          var s = localStorage.getItem('playervalue_theme');

          document.documentElement.setAttribute('data-theme', t);
        } catch(e) {}
      })();
    </script>

                </div>
            </header>

            <div id="clubs-container"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
