<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayerValue | Players Database</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div id="breadcrumbs-container"></div>
            
            <header class="page-header">
                <div>
                    <h1 class="page-title">Players Database</h1>
                    <p class="page-subtitle">Search, filter, and analyze 10,715 players across top European leagues.</p>
                </div>
            </header>

            <div class="filter-bar" id="filters-container">
                <div class="filter-group">
                    <label class="filter-label">Search Name</label>
                    <input type="text" id="f-name" class="filter-input" placeholder="e.g. Haaland">
                </div>
                <div class="filter-group">
                    <label class="filter-label">Position</label>
                    <select id="f-position" class="filter-input">
                        <option value="">All Positions</option>
                        <option value="GK">Goalkeeper (GK)</option>
                        <option value="CB">Centre-Back (CB)</option>
                        <option value="LB">Left-Back (LB)</option>
                        <option value="RB">Right-Back (RB)</option>
                        <option value="DM">Defensive Midfield (DM)</option>
                        <option value="CM">Central Midfield (CM)</option>
                        <option value="AM">Attacking Midfield (AM)</option>
                        <option value="LW">Left Winger (LW)</option>
                        <option value="RW">Right Winger (RW)</option>
                        <option value="ST">Striker (ST)</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">League</label>
                    <select id="f-league" class="filter-input"><option value="">All Leagues</option></select>
                </div>
                <div class="filter-group">
                    <label class="filter-label">Club</label>
                    <select id="f-club" class="filter-input"><option value="">All Clubs</option></select>
                </div>
                <div class="filter-group" style="max-width:110px;">
                    <label class="filter-label">Min Age</label>
                    <input type="number" id="f-min-age" class="filter-input" placeholder="16">
                </div>
                <div class="filter-group" style="max-width:110px;">
                    <label class="filter-label">Max Age</label>
                    <input type="number" id="f-max-age" class="filter-input" placeholder="40">
                </div>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th onclick="handleSort('name')">Player</th>
                            <th onclick="handleSort('age')">Age</th>
                            <th onclick="handleSort('primary_position')">Pos</th>
                            <th>League</th>
                            <th onclick="handleSort('minutes')">Minutes</th>
                            <th onclick="handleSort('market_value_eur')">Market Value</th>
                            <th onclick="handleSort('predicted_value_eur')">Model Implied</th>
                            <th>Valuation Gap</th>
                        </tr>
                    </thead>
                    <tbody id="players-tbody"></tbody>
                </table>
            </div>

            <div id="pagination-container" style="display:flex; justify-content:center; margin-top:24px;"></div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/components.js"></script>
    <script src="js/players.js"></script>
</body>
</html>
