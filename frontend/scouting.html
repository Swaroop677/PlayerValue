<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlayerValue | Advanced Scouting</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .scouting-layout { display: flex; gap: 24px; align-items: flex-start; }
        .scouting-sidebar { width: 300px; flex-shrink: 0; }
        .scouting-main { flex: 1; min-width: 0; }
        @media (max-width: 900px) {
            .scouting-layout { flex-direction: column; }
            .scouting-sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div id="breadcrumbs-container"></div>
            
            <header class="page-header" style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 24px; flex-wrap:wrap; gap:16px;">
                <div>
                    <h1 class="page-title" style="font-size:32px; font-weight:800; color:var(--color-ink); margin-bottom:6px;">Advanced Scouting Matrix</h1>
                    <p class="page-subtitle" style="font-size:15px; color:var(--color-ink-soft);">Multi-attribute filter matrix for talent scouting and head-to-head player comparison.</p>
                </div>
                <button id="btn-compare" class="btn btn-primary" disabled>Compare Selected (0)</button>
            </header>

            <div class="scouting-layout">
                <div class="scouting-sidebar card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                        <h3 style="font-size:16px; font-weight:700; color:var(--color-ink);">Scouting Filters</h3>
                        <button id="btn-reset-filters" class="filter-clear-all" type="button">Reset</button>
                    </div>
                    
                    <div class="filter-group mb-2" style="margin-bottom:12px;">
                        <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Position</label>
                        <select id="s-position" class="filter-select" style="width:100%;">
                            <option value="">All Positions</option>
                            <option value="ST">Striker (ST)</option>
                            <option value="LW">Left Winger (LW)</option>
                            <option value="RW">Right Winger (RW)</option>
                            <option value="AM">Attacking Midfield (AM)</option>
                            <option value="CM">Central Midfield (CM)</option>
                            <option value="DM">Defensive Midfield (DM)</option>
                            <option value="CB">Centre-Back (CB)</option>
                            <option value="LB">Left-Back (LB)</option>
                            <option value="RB">Right-Back (RB)</option>
                            <option value="GK">Goalkeeper (GK)</option>
                        </select>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
                        <div>
                            <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Min Age</label>
                            <input type="number" id="s-min-age" class="filter-input" placeholder="16" style="padding-left:12px;">
                        </div>
                        <div>
                            <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Max Age</label>
                            <input type="number" id="s-max-age" class="filter-input" placeholder="38" style="padding-left:12px;">
                        </div>
                    </div>

                    <div class="filter-group" style="margin-bottom:16px;">
                        <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Max Market Value (€M)</label>
                        <input type="number" id="s-max-value" class="filter-input" placeholder="e.g. 50" style="padding-left:12px;">
                    </div>
                    
                    <h4 style="font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--color-ink-muted); margin:18px 0 10px 0; border-top:1px solid var(--color-border); padding-top:12px;">Performance Filters</h4>
                    
                    <div class="filter-group" style="margin-bottom:12px;">
                        <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Min Minutes Played</label>
                        <input type="number" id="s-min-mins" class="filter-input" placeholder="e.g. 900" style="padding-left:12px;">
                    </div>
                    
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
                        <div>
                            <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Min Goals</label>
                            <input type="number" id="s-min-goals" class="filter-input" placeholder="e.g. 5" style="padding-left:12px;">
                        </div>
                        <div>
                            <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Min Assists</label>
                            <input type="number" id="s-min-assists" class="filter-input" placeholder="e.g. 3" style="padding-left:12px;">
                        </div>
                    </div>

                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;">
                        <div>
                            <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Min Prog. Passes</label>
                            <input type="number" id="s-min-prog-p" class="filter-input" placeholder="e.g. 40" style="padding-left:12px;">
                        </div>
                        <div>
                            <label class="filter-label" style="display:block; font-size:12px; font-weight:700; color:var(--color-ink-soft); margin-bottom:4px;">Min Tackles</label>
                            <input type="number" id="s-min-tackles" class="filter-input" placeholder="e.g. 15" style="padding-left:12px;">
                        </div>
                    </div>

                    <button id="btn-apply-filters" class="btn btn-primary" style="width:100%;">Apply Scouting Matrix</button>
                </div>

                <div class="scouting-main">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th style="width:40px; text-align:center;">Compare</th>
                                    <th>Player</th>
                                    <th>Pos</th>
                                    <th>Age</th>
                                    <th>Club</th>
                                    <th>Market Value</th>
                                    <th>Model Implied</th>
                                    <th>Valuation Gap</th>
                                </tr>
                            </thead>
                            <tbody id="scouting-tbody"></tbody>
                        </table>
                    </div>

                    <div id="pagination-container" style="display:flex; justify-content:center; margin-top:24px;"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/club_logos_data.js"></script>
    <script src="js/components.js"></script>
    <script src="js/scouting.js"></script>
</body>
</html>
